id: silver-acanthus-scroll-with-blue-and-red-flowers
title: Silver acanthus with roses and blue flowers
description: A tall vertical border piece. A silver-gray acanthus scroll with white highlights curls through two large C-shapes in the middle, threaded by thin red stems that carry four red roses with gold centres at the top, bell-shaped blue flowers and two brownish-red blossoms below, and green leaves and small round buds throughout. Painted with fine dark contours; the background is transparent.
